name: Build & Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Using default Xcode"
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and Package IPA
        run: |
          xcodebuild -scheme DeviceMeter \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/DeviceMeter.xcarchive \
            -arch arm64 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE= \
            archive

          mkdir -p Payload
          cp -r build/DeviceMeter.xcarchive/Products/Applications/DeviceMeter.app Payload/
          cd Payload
          zip -r ../DeviceMeter.ipa .
          cd ..
          rm -rf Payload build/DeviceMeter.xcarchive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMeter
          path: DeviceMeter.ipa

      - name: Upload to releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: DeviceMeter.ipa
          tag_name: latest
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme DeviceMeter \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build
