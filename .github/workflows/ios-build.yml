name: Build & Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_*.app/Contents/Developer || \
          ls -d /Applications/Xcode_*.app | sort -V | tail -1 | xargs sudo xcode-select -s

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Release
        run: |
          xcodebuild build \
            -scheme DeviceMeter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -arch arm64 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE=

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DeviceMeter.app Payload/
          cd Payload
          zip -r ../DeviceMeter.ipa .
          cd ..
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMeter
          path: DeviceMeter.ipa

      - name: Upload to releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: DeviceMeter.ipa
          tag_name: latest
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme DeviceMeter \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build
